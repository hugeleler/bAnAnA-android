<h1>常见问题</h1>
<h2>候选只能走到第 6 个？</h2>
<p>把候选翻页改成「左右滑动」，数量用「随方案」。按钮模式才会按 6 个一页翻。</p>
<h2>装不上 / 找不到键盘？</h2>
<p>确认设备是 arm64，并已在系统输入法列表启用。</p>
<h2>没有语言模型文件？</h2>
<p>安装包零 gram。到应用里的语言模型列表下载。</p>
